services:
  - type: web
    name: glycoguard-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: glycoguard-db
          property: connectionString

databases:
  - name: glycoguard-db
    plan: free
    databaseName: glycoguard
    user: glycoguard_user
