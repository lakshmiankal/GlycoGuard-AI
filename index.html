<!DOCTYPE html>

<html>

<head>
    <title>GlycoGuard AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg1: #0B1220;
            --bg2: #0F172A;
            --card: #0F1B33;
            --border: rgba(255, 255, 255, 0.08);
            --text: #E5E7EB;
            --muted: #94A3B8;
            --primary: #2563EB;
            --accent: #06B6D4;
            --low: #10B981;
            --med: #F59E0B;
            --high: #EF4444;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(800px 400px at 10% -10%, rgba(37, 99, 235, .25), transparent 60%),
                radial-gradient(800px 400px at 110% 10%, rgba(6, 182, 212, .2), transparent 60%),
                linear-gradient(180deg, var(--bg1), var(--bg2));
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 24px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: .3px;
        }

        .badge {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(6, 182, 212, .15);
            color: #7DD3FC;
            border: 1px solid rgba(6, 182, 212, .35);
        }

        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, .02), rgba(255, 255, 255, .01));
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
        }

        .card h2 {
            margin: 0 0 12px 0;
            font-size: 18px;
            color: #C7D2FE;
            letter-spacing: .3px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: .2px;
        }

        input {
            padding: 12px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0B1328;
            color: var(--text);
            outline: none;
            transition: .2s;
        }

        input::placeholder {
            color: #64748B;
        }

        input:focus {
            border-color: rgba(37, 99, 235, .7);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .25);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: .2px;
            color: white;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            box-shadow: 0 10px 20px rgba(37, 99, 235, .35);
            transition: .15s transform, .15s opacity;
        }

        .btn.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: #C7D2FE;
            box-shadow: none;
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: .95;
        }

        .result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px;
            border-radius: 14px;
            border: 1px dashed var(--border);
            background: #0B1328;
        }

        .result .left {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .kpi {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: .3px;
        }

        .sub {
            color: var(--muted);
            font-size: 13px;
        }

        .pill {
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 12px;
            border: 1px solid;
        }

        .low {
            color: #065F46;
            background: #D1FAE5;
            border-color: #A7F3D0;
        }

        .medium {
            color: #7C2D12;
            background: #FFEDD5;
            border-color: #FED7AA;
        }

        .high {
            color: #7F1D1D;
            background: #FEE2E2;
            border-color: #FECACA;
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="header">
            <div class="brand">🩺 GlycoGuard AI</div>
            <div class="badge">Risk Estimation • Not a diagnosis</div>
        </div>

        <!-- INPUT -->
        <div class="card">
            <h2>Health Inputs</h2>

            <div class="grid">
                <div class="field"><label>Pregnancies</label><input type="number" id="pregnancies" placeholder="e.g. 2"></div>
                <div class="field"><label>Glucose</label><input type="number" id="glucose" placeholder="e.g. 120"></div>
                <div class="field"><label>Blood Pressure</label><input type="number" id="bloodPressure" placeholder="e.g. 70"></div>
                <div class="field"><label>Skin Thickness</label><input type="number" id="skinThickness" placeholder="e.g. 20"></div>
                <div class="field"><label>Insulin</label><input type="number" id="insulin" placeholder="optional"></div>
                <div class="field"><label>BMI</label><input type="number" id="bmi" placeholder="e.g. 25.4"></div>
                <div class="field"><label>Diabetes Pedigree</label><input id="DPF" placeholder="e.g. 0.5"></div>
                <div class="field"><label>Age</label><input id="Age" placeholder="e.g. 30"></div>
                <div class="field"><label>Exercise (min/day)</label><input id="exercise" placeholder="e.g. 30"></div>
                <div class="field"><label>Sleep (hrs)</label><input id="sleep" placeholder="e.g. 7"></div>
                <div class="field"><label>Stress Level (1–10)</label><input id="stress" placeholder="e.g. 4"></div>
            </div>

            <div class="actions">
                <button onclick="predictRisk()">
                    Predict Risk
                </button>
                <h2 id="riskLevel"></h2>
                <p id="probability"></p>
                <p id="recommendation"></p>
                <button class="btn secondary" onclick="clearForm()">Clear</button>
            </div>
        </div>
        <div class="card">
            <h2>Result</h2>

            <div id="resultBox" class="result">
                <div class="left">
                    <div id="kpi" class="kpi">—</div>
                    <div id="prob" class="sub">Enter values and click “Predict Risk”</div>
                </div>
                <div id="pill" class="pill">No data</div>
            </div>
        </div>

        <div class="footer">
            This tool provides risk estimation only. Please consult a clinician for testing.
        </div>

    </div>
<script>
        function predict() {
            const data = {
                Pregnancies: Number(document.getElementById("Pregnancies").value),
                Glucose: Number(document.getElementById("Glucose").value),
                BloodPressure: Number(document.getElementById("BloodPressure").value),
                SkinThickness: Number(document.getElementById("SkinThickness").value),
                Insulin: Number(document.getElementById("Insulin").value),
                BMI: Number(document.getElementById("BMI").value),
                DiabetesPedigreeFunction: Number(document.getElementById("DPF").value),
                Age: Number(document.getElementById("Age").value),
                exercise_minutes: Number(document.getElementById("exercise").value),
                sleep_hours: Number(document.getElementById("sleep").value),
                stress_level: Number(document.getElementById("stress").value)
            };

            fetch("http://127.0.0.1:5000/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
                .then(r => r.json())
                .then(res => {
                    if (!res || !res.risk_level) {
                        setResult("Error", "Could not get result", "medium");
                        return;
                    }
                    const cls = res.risk_level === "High" ? "high" :
                        res.risk_level === "Medium" ? "medium" : "low";

                    document.getElementById("kpi").innerText = res.risk_level + " Risk";
                    document.getElementById("prob").innerText = "Probability: " + res.probability.toFixed(2);

                    const pill = document.getElementById("pill");
                    pill.className = "pill " + cls;
                    pill.innerText = res.risk_level;
                })
                .catch(() => setResult("Error", "Server not reachable", "medium"));
        }

        function setResult(title, subtitle, cls) {
            document.getElementById("kpi").innerText = title;
            document.getElementById("prob").innerText = subtitle;
            const pill = document.getElementById("pill");
            pill.className = "pill " + cls;
            pill.innerText = title;
        }

        function clearForm() {
            ["pregnancies", "glucose", "bloodPressure", "skinThickness", "insulin", "bmi", "DPF", "Age", "exercise", "sleep", "stress"]
                .forEach(id => document.getElementById(id).value = "");
            setResult("—", "Enter values and click “Predict Risk”", "medium");
        }
    </script>
    <script src="script.js"></script>
    </body>
</html>
